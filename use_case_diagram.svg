<svg width="920" height="720" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">

  <!-- Background -->
  <rect width="920" height="720" fill="white"/>

  <!-- System boundary -->
  <rect x="160" y="55" width="590" height="560" fill="#f8f9fa" stroke="#444" stroke-width="2.5" rx="6"/>
  <text x="455" y="80" text-anchor="middle" font-size="16" font-weight="bold" fill="#111">Форум</text>
  <!-- Vertical separator -->
  <line x1="462" y1="92" x2="462" y2="608" stroke="#ccc" stroke-width="1.2" stroke-dasharray="6,4"/>
  <!-- Section labels -->
  <text x="315" y="106" text-anchor="middle" font-size="10" fill="#888">Гость</text>
  <text x="600" y="106" text-anchor="middle" font-size="10" fill="#888">Зарегистрированный пользователь</text>

  <!-- Connection lines drawn BEFORE ellipses so ellipses cover the ends -->

  <!-- Guest → Use cases (from arm tip ~104,279) -->
  <line x1="104" y1="271" x2="315" y2="148" stroke="#888" stroke-width="1.4"/>
  <line x1="104" y1="278" x2="315" y2="228" stroke="#888" stroke-width="1.4"/>
  <line x1="104" y1="279" x2="315" y2="308" stroke="#888" stroke-width="1.4"/>
  <line x1="104" y1="286" x2="315" y2="388" stroke="#888" stroke-width="1.4"/>

  <!-- Registered User → Use cases (from arm tip ~816,279) -->
  <line x1="816" y1="270" x2="600" y2="135" stroke="#888" stroke-width="1.4"/>
  <line x1="816" y1="277" x2="600" y2="205" stroke="#888" stroke-width="1.4"/>
  <line x1="816" y1="279" x2="600" y2="275" stroke="#888" stroke-width="1.4"/>
  <line x1="816" y1="285" x2="600" y2="345" stroke="#888" stroke-width="1.4"/>
  <line x1="816" y1="291" x2="600" y2="415" stroke="#888" stroke-width="1.4"/>
  <line x1="816" y1="297" x2="600" y2="490" stroke="#888" stroke-width="1.4"/>

  <!-- Use case ellipses (drawn on top of lines) -->

  <!-- Left: Guest accessible -->
  <ellipse cx="315" cy="148" rx="120" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>
  <ellipse cx="315" cy="228" rx="133" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>
  <ellipse cx="315" cy="308" rx="100" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>
  <ellipse cx="315" cy="388" rx="110" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>

  <!-- Right: Registered User accessible -->
  <ellipse cx="600" cy="135" rx="112" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>
  <ellipse cx="600" cy="205" rx="126" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>
  <ellipse cx="600" cy="275" rx="128" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>
  <ellipse cx="600" cy="345" rx="112" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>
  <ellipse cx="600" cy="415" rx="112" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>
  <ellipse cx="600" cy="490" rx="118" ry="28" fill="white" stroke="#444" stroke-width="1.6"/>

  <!-- Use case labels -->
  <text x="315" y="153" text-anchor="middle" font-size="12" fill="#111">Просмотр постов</text>
  <text x="315" y="233" text-anchor="middle" font-size="12" fill="#111">Просмотр комментариев</text>
  <text x="315" y="313" text-anchor="middle" font-size="12" fill="#111">Регистрация</text>
  <text x="315" y="393" text-anchor="middle" font-size="12" fill="#111">Вход в систему</text>

  <text x="600" y="140" text-anchor="middle" font-size="12" fill="#111">Создание поста</text>
  <text x="600" y="210" text-anchor="middle" font-size="12" fill="#111">Удаление своего поста</text>
  <text x="600" y="280" text-anchor="middle" font-size="12" fill="#111">Добавление комментария</text>
  <text x="600" y="350" text-anchor="middle" font-size="12" fill="#111">Просмотр профиля</text>
  <text x="600" y="420" text-anchor="middle" font-size="12" fill="#111">Изменение пароля</text>
  <text x="600" y="495" text-anchor="middle" font-size="12" fill="#111">Выход из системы</text>

  <!-- Guest actor (x=76) -->
  <circle cx="76" cy="240" r="19" fill="white" stroke="#333" stroke-width="2"/>
  <line x1="76" y1="259" x2="76" y2="308" stroke="#333" stroke-width="2"/>
  <line x1="48" y1="279" x2="104" y2="279" stroke="#333" stroke-width="2"/>
  <line x1="76" y1="308" x2="53" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="76" y1="308" x2="99" y2="340" stroke="#333" stroke-width="2"/>
  <text x="76" y="362" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">Гость</text>

  <!-- Registered User actor (x=844) -->
  <circle cx="844" cy="240" r="19" fill="white" stroke="#333" stroke-width="2"/>
  <line x1="844" y1="259" x2="844" y2="308" stroke="#333" stroke-width="2"/>
  <line x1="816" y1="279" x2="872" y2="279" stroke="#333" stroke-width="2"/>
  <line x1="844" y1="308" x2="821" y2="340" stroke="#333" stroke-width="2"/>
  <line x1="844" y1="308" x2="867" y2="340" stroke="#333" stroke-width="2"/>
  <text x="844" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">Зарегистрированный</text>
  <text x="844" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#222">пользователь</text>

  <!-- Generalization arrow: Registered User → Guest (hollow triangle = UML inheritance) -->
  <line x1="844" y1="400" x2="844" y2="668" stroke="#333" stroke-width="1.8"/>
  <line x1="844" y1="668" x2="76"  y2="668" stroke="#333" stroke-width="1.8"/>
  <line x1="76"  y1="668" x2="76"  y2="416" stroke="#333" stroke-width="1.8"/>
  <!-- Hollow triangle (arrowhead pointing UP toward Guest) -->
  <polygon points="76,400 65,418 87,418" fill="white" stroke="#333" stroke-width="1.8"/>
  <!-- Label below the arrow path -->
  <text x="460" y="662" text-anchor="middle" font-size="11" fill="#555" font-style="italic">&#171;обобщение&#187;</text>

</svg>
